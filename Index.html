<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVENOA | Your World of Cinema</title>

    <style>body {
    background: linear-gradient(135deg, #263b78, #e7e6ea, #7aacdf);
    color: #ffffff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0d;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 7%;
            background: #111113;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #e5c5c5;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }

        .hero {
            padding: 100px 7%;
            background: linear-gradient(90deg, #190d12, #32151e, #0b0b0d);
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #c5b9bd;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .hero button {
            background: #8e263e;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .section {
            padding: 40px 7%;
        }

        .section h2 {
            margin-bottom: 25px;
            font-size: 25px;
        }

        .movies {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 22px;
        }

        .movie {
            background: #18181c;
            border-radius: 8px;
            overflow: hidden;
            transition: 0.3s;
        }

        .movie:hover {
            transform: translateY(-6px);
        }

        .movie img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .movie h3 {
            padding: 12px;
            font-size: 15px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            border-top: 1px solid #252529;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 18px;
            }

            nav a {
                margin: 0 8px;
            }

            .hero h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">AVENOA</div>

        <nav>
            <a href="#">Home</a>
            <a href="#movies">Movies</a>
            <a href="#categories">Genres</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Your World of Cinema.</h1>
        <p>Discover stories. Experience cinema.</p>
        <button onclick="document.getElementById('movies').scrollIntoView({behavior:'smooth'})">
            Explore Movies
        </button>
    </section>

    <section class="section" id="movies">
        <h2>Featured Movies</h2>

        <div class="movies">
            <div class="movie">
                <img src="https://placehold.co/300x450/24151b/ffffff?text=Movie+01" alt="Film 1">
                <h3>Coming Soon</h3>
            </div>

            <div class="movie">
                <img src="https://placehold.co/300x450/24151b/ffffff?text=Movie+02" alt="Film 2">
                <h3>Coming Soon</h3>
            </div>

            <div class="movie">
                <img src="https://placehold.co/300x450/24151b/ffffff?text=Movie+03" alt="Film 3">
                <h3>Coming Soon</h3>
            </div>

            <div class="movie">
                <img src="https://placehold.co/300x450/24151b/ffffff?text=Movie+04" alt="Film 4">
                <h3>Coming Soon</h3>
            </div>
        </div>
    </section>

    <footer>
        © 2026 AVENOA. Your World of Cinema.
    </footer>

</body>
</html>
